# Beispiel: Port ändern
server.port=8080
server.servlet.context-path=/api/v1
spring.application.name=fitness-planer

# ---------------------------------------------------------------
# Database: H2 in-memory for local development
# ---------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:fitness;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Let Hibernate create/update the schema in development.
# For production (PostgreSQL) use `validate` + a migration tool like Flyway/Liquibase.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

